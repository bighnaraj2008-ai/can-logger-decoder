name: CI Build & Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc clang make cmake

    - name: Compile with ${{ matrix.compiler }}
      run: |
        make clean
        make CC=${{ matrix.compiler }} all

    - name: Run Test Suites
      run: |
        make CC=${{ matrix.compiler }} test

    - name: Run Automated Test Runner Script
      run: |
        chmod +x scripts/run_unit_tests.sh
        ./scripts/run_unit_tests.sh

    - name: Verify CLI Execution with Sample DBC
      run: |
        ./can_decoder -d sample.dbc --summary
        ./can_decoder -d sample.dbc --mock -c 20

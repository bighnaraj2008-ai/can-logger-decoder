name: Dependency & Integrity Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: dependency-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-integrity:
    name: Validate DBC and Fixture Checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate DBC Schema Syntax
        run: |
          echo "Validating sample.dbc header and message structure..."
          test -s sample.dbc
          grep -q "^VERSION" sample.dbc
          grep -q "^BO_ " sample.dbc
          grep -q "^SG_ " sample.dbc
          echo "sample.dbc syntax verified."

      - name: Validate Test Fixtures Checksums
        run: |
          chmod +x scripts/validate_fixtures.sh
          ./scripts/validate_fixtures.sh

      - name: Check Build Tools Availability
        run: |
          command -v make >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y make)
          command -v cmake >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y cmake)
          echo "Build tools verified."